<title>离线 · AI 狼人杀</title>
<!-- 样式内联：这个页面必须在"任何外部资源都取不到"时仍然能看（test/pwa.test.js 因此
     禁止它外链样式表/脚本），所以这里内联一份**最小镜像**，语义名与取值对齐
     web/shared/tokens.css（§3 六色 + RGB 三元组）。镜像与正本的一致性由
     test/css.test.js 的「离线页令牌镜像」用例逐项比对：改了正本忘了改这里会红。 -->
<style>
  :root {
    --sem-bg: #06090f; --sem-panel: #0f1626; --sem-ink: #ebe4d7;
    --sem-gold: #d8b25f; --sem-moon: #dbe6ff; --sem-danger: #b3323f;
    --sem-bg-rgb: 6, 9, 15; --sem-panel-rgb: 15, 22, 38; --sem-ink-rgb: 235, 228, 215;
    --sem-gold-rgb: 216, 178, 95; --sem-moon-rgb: 219, 230, 255; --sem-danger-rgb: 179, 50, 63;
    /* 下面四个是 style.css 既有令牌的同值副本（本页自足，只能内联） */
    --muted: #8d96b7; --gold-bright: #f4de9f; --gold-dim: #8a6b23; --accent-dark: #7d1c27;
  }
  html, body { margin: 0; height: 100%; background: var(--sem-bg); color: var(--sem-ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 14px; }
  .ring { width: 120px; height: 120px; border-radius: 50%; border: 6px solid var(--gold-dim); box-shadow: inset 0 0 0 4px var(--sem-gold); background: var(--accent-dark); display: flex; align-items: center; justify-content: center; }
  /* 品牌环里的狼首：仓库既有徽记（web/assets/brand/wolf-emblem.svg）的**内联**副本
     —— 用 <img> 就得发一次外部请求，违背本页"断网也要能看"的前提（P2-7）；
     也不再拿 emoji 当品牌标记（计划书 §3 行 78：核心品牌用统一 SVG，内容 emoji 才保留）。 */
  .ring-mark { width: 86px; height: 99px; display: block; }
  h1 { font-size: 20px; margin: 6px 0 0; letter-spacing: 1px; }
  p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; max-width: 30em; }
  .hint { color: var(--sem-gold); }
  button { margin-top: 8px; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--sem-gold);
    background: transparent; color: var(--gold-bright); font-size: 15px; cursor: pointer; }
  button:hover { background: rgba(var(--sem-gold-rgb), .12); }
</style>

  </g>
  </svg></div>
  <h1>现在没有网络</h1>
  <p>离线时打不开新对局：<span class="hint">AI 在服务器端调用模型</span>，断网就没法继续了。</p>
  <p>已经打开过的页面可以脱离网络显示，但任何推进对局的操作都需要联网——这是单并发、串行调用的必然结果，不是缓存能绕开的。</p>
  <button id="offline-retry" type="button">重试</button>
</div>
<script>
  /*
    本页的两个交互（重试 / 网络恢复自动回首页）必须靠**内联**脚本，这是被钉死的设计前提：
    test/pwa.test.js 的「离线页：不得依赖任何外部资源」禁止本页引用外部脚本
    （断网时它必须能自己渲染），所以不能把它挪到 web/offline.js 去外链。

    代价是：服务的 CSP（src/static.js 的 script-src）没有 'unsafe-inline'，
    脚本必须靠 sha256 白名单放行 —— 这段代码的哈希**已经**登记进那份白名单。
    在补登记之前，CSP 会把整段脚本**静默**拦掉：控制台只有一条 violation，
    页面上「重试」点了没反应、网络恢复也不会回首页（本页此前的真实状态）。

    ⚠ 改这段脚本的**任何一个字符**（含注释与缩进）都必须同步更新 src/static.js 的
      script-src 白名单；web/offline.html 的行尾也必须保持 LF
      （.gitattributes 已钉 `text eol=lf`：一旦命中 CSP 白名单，brand:check 会
      按"CSP 白名单页面"强制要求这条行尾钉版，否则哈希在 Windows 检出上必然错位）。
    ⚠ 内联事件属性（原来的 onclick="location.reload()"）同样会被 CSP 拦掉，
      且 remediation.test.js 的同类用例已禁止内联事件属性 —— 所以改成在这里接线。
    判据：test/offline-page.test.js（逐页比对"内联脚本哈希 ↔ 白名单"，并核对
    脚本里取的 id 与页面上的元素一致 —— 免得改名之后按钮又变成摆设）。
  */
  (function () {
    var retry = document.getElementById('offline-retry');
    if (retry) retry.addEventListener('click', function () { location.reload(); });
    // 网络恢复就自动回首页（离线页不该困住用户）
    window.addEventListener('online', function () { location.replace('/'); });
  })();
</script>
