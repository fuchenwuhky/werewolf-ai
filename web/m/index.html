<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI狼人杀">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<title>AI 狼人杀 · APP</title>
<link rel="stylesheet" href="m.css">
</head>
<body>
<script>
/* 初始化守卫：与桌面版同一套逻辑（见 web/index.html 的说明）。手机端还多一层意义：
   从 /m/ 进来时 m.js 要先拉 /api/meta 才渲染板子列表，这段窗口里的点击同样不能"毫无反应"。
   两条安全线：m.js 初始化完成后置 __wwReady=true 放行；8 秒兜底放行，避免界面被永久点死。 */
(function () {
  window.__wwReady = false;
  var deadline = Date.now() + 8000;
  document.addEventListener('click', function (e) {
    if (window.__wwReady || Date.now() > deadline) return;
    var box = document.getElementById('m-err');
    if (box) box.textContent = '⏳ 界面正在加载配置，请稍候…';
    e.preventDefault();
    e.stopPropagation();
  }, true);
})();
</script>
<a class="skip-link" href="#m-app" data-i18n="skip.toMain">跳到主内容</a>
<!-- 氛围层：与桌面版同一套（天空 / 群星 / 月亮 / 颗粒 / 暗角）。
     手机端不放村舍剪影 —— 小屏上那点细节只会变成噪点。CSS 见 style.css 的「氛围层」一节。 -->
<div class="atmosphere" aria-hidden="true">
  <div class="atmo-sky"></div>
  <div class="atmo-stars"></div>
  <div class="atmo-moon"><span class="moon-halo"></span><span class="moon-disc"></span></div>
  <div class="atmo-grain"></div>
  <div class="atmo-vignette"></div>
</div>
<div id="m-app" role="main" tabindex="-1">

  <!-- 屏1：选择板子 -->
  <section id="m-boards" class="m-screen">
    <header class="m-head">
      <h1 data-i18n="m.title">🦇 AI 狼人杀</h1>
      <p class="m-sub" data-i18n="m.sub">✠ 选择你的战场 ✠</p>
    </header>
    <div id="m-board-grid" class="m-grid"></div>
    <div class="m-foot">
      <button class="btn" id="m-mock-btn" title="Mock 试玩：不调用 API、不消耗额度">🧪 试玩</button>
      <button class="btn" id="m-settings-btn" data-i18n="m.settings">⚙ 设置</button>
      <button class="btn" id="m-codex-btn" data-i18n="codex.entry">📖 角色图鉴</button>
      <button class="btn" id="btn-lang" data-i18n-title="api.langSwitch" title="切换界面语言">🌐 中</button>
      <span class="hint" id="m-hint"></span>
      <button class="btn primary" id="m-next" disabled data-i18n="m.next">下一步 →</button>
    </div>
  </section>

  <!-- 屏2：角色图鉴（渲染在共享模块 ../codex.js 里，与桌面版同一份逻辑）
       与小屏的分工：牌用两列网格（132px 起），点牌不再挤右侧栏，而是弹层看细节——
       手机宽度放不下"左翻牌 + 右细节"的并排布局。 -->
  <section id="m-codex" class="m-screen hidden">
    <header class="m-head">
      <button class="btn small" id="m-codex-back" data-i18n-title="codex.back" title="返回">←</button>
      <h2 data-i18n="codex.title">角色图鉴</h2>
      <button class="btn small ghost" id="cdx-rulebook" data-i18n="codex.rulebook">📖 完整规则书</button>
    </header>
    <p class="cdx-sub" id="cdx-sub"></p>
    <input id="cdx-search" type="search" data-i18n-placeholder="codex.search" placeholder="搜索身份…" data-i18n-aria="codex.search" aria-label="搜索身份">
    <div class="cdx-filters" id="cdx-filters"></div>
    <div class="cdx-grid" id="cdx-grid"></div>
  </section>

  <!-- 屏3：规则确认 -->
  <section id="m-rules" class="m-screen hidden">    <header class="m-head">
      <button class="btn small" id="m-back" data-i18n-title="m.back" title="返回">←</button>
      <h2 id="m-rules-title" data-i18n="m.rulesTitle">对局规则</h2>
    </header>
    <div class="m-scroll">
      <div id="m-board-summary" class="m-summary"></div>
      <div id="m-custom-editor" class="hidden"></div>
      <h3 class="m-h3" data-i18n="m.rulesSection">⚔ 对局规则</h3>
      <div id="m-rules-list"></div>
      <div class="row2">
        <label><span data-i18n="players.seat">我的座位</span><select id="m-my-seat"></select></label>
        <label><span data-i18n="players.name">我的昵称</span><input id="m-my-name" value="我" maxlength="12"></label>
      </div>
      <!-- 玩家档案（PROF-01）：对局归属到所选档案，战绩/笔记按档案隔离；管理弹层在 m.js 里 -->
      <div class="m-profile-row">
        <label><span>我的档案</span><select id="m-profile-select" title="对局将归属到该档案（战绩/笔记按档案隔离）"></select></label>
        <button class="btn ghost small" id="m-profile-manage" type="button">管理档案…</button>
      </div>
      <p class="hint" style="margin-top:10px" data-i18n="m.aiNamesHint">AI 昵称开局自动从名字库随机（进入对局后无法修改）</p>
      <a class="btn ghost" href="../ai-cast.html?from=mobile" target="_blank" rel="noopener">AI 来客名册 ↗</a>
    </div>
    <div class="m-foot">
      <span class="hint" id="m-err"></span>
      <button class="btn primary big" id="m-start" data-i18n="m.start">⚔ 开始游戏</button>
    </div>
  </section>

  <!-- 屏4：对局（左右座位 + 中间流程 + 底部身份/技能/对话框） -->
  <section id="m-game" class="m-screen hidden">
    <header class="m-bar">
      <button class="m-gear" id="m-gear" title="设置" aria-label="设置" data-i18n-title="m.gearTitle">⚙</button>
      <div class="m-status">
        <b id="m-day"></b>
        <span id="m-phase" class="m-phase-chip"></span>
        <span id="m-memory" class="m-phase-chip hidden"></span>
      </div>
      <button class="m-bar-btn" id="m-rulebook-btn" title="规则书" aria-label="规则书" data-i18n-title="game.rulebookTitle">📖</button>
    </header>

    <!-- 暂停横幅：配额/套餐等外部原因导致对局暂停（不是结束，可恢复） -->
    <div id="m-paused-banner" class="m-paused-banner hidden"></div>

    <!-- 牌桌：左半桌座位 | 中间流程与发言 | 右半桌座位 -->
    <main class="m-board">
      <aside class="m-seatcol" id="m-seats-l" aria-label="左半桌座位"></aside>
      <section class="m-flow-wrap">
        <div id="m-flow" class="m-flow" role="log" aria-live="polite" aria-label="对局流程与发言" data-i18n-aria="game.streamAria"></div>
        <button id="m-to-bottom" class="m-to-bottom hidden" title="回到最新">↓ 最新</button>
      </section>
      <aside class="m-seatcol" id="m-seats-r" aria-label="右半桌座位"></aside>
    </main>

    <!-- 底部：左=身份牌，右=对话框（提示 + 输入框 + 技能键统一在动作行） -->
    <footer class="m-dock">
      <button id="m-mycard" class="m-mycard" title="我的身份牌（点击查看）" aria-label="我的身份牌"></button>
      <div class="m-dialog-wrap">
        <div id="m-pending-hint" class="pending-hint"></div>
        <div id="m-dialog" class="m-dialog"></div>
        <div id="m-keys" class="m-keys"></div>
      </div>
    </footer>
  </section>
</div>

<div id="m-modal"></div>
<!-- 底部弹层（手机习惯）：档案管理（PROF-01）与私人标注编辑（NOTE-04）的容器，内容由 m.js 填充 -->
<div id="m-sheet"></div>
<div id="m-flash" class="m-flash hidden"></div>
<div id="m-flip" class="m-flip hidden">
  <div class="flip-card" id="m-flip-card">
    <div class="flip-inner">
      <!-- 提示文案放在内层 span：i18n 是直接重写 [data-i18n-html] 元素的 innerHTML 的，
           挂在 .flip-back 上会把启动时注入的框层一起冲掉（桌面端的 .cb-txt 就是这个结构） -->
      <div class="flip-back"><span class="cb-txt" data-i18n-html="m.flipHint">身份牌<br>点击翻开</span></div>
      <div class="flip-front" id="m-flip-front"></div>
    </div>
  </div>
  <div class="flip-caption" id="m-flip-caption"></div>
  <div class="flip-tools">
    <button class="btn primary" id="m-flip-done" data-i18n="m.start">开始游戏</button>
    <button class="btn" id="m-inspect-btn" data-i18n="m.inspect">🔍 检视</button>
  </div>
</div>
<script src="../i18n.js"></script>
<script src="../card-frame.js"></script>
<script src="../codex.js"></script>
<script src="../rulebook.js"></script>
<script src="../pwa.js"></script>
<script src="../ai-cast.js"></script>
<script src="../shared/annotations-model.js"></script>
<script src="m.js"></script>
</body>
</html>
