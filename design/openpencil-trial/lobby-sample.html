<!doctype html>
<html lang="zh-CN">

<title>月夜议会 · OpenPencil 导入试验</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1120px; min-height: 680px; background: #0c1019; color: #f0e6d6; font-family: "Microsoft YaHei", sans-serif; }
  .shell { width: 1120px; min-height: 680px; padding: 28px; background: #0c1019; }

  .eyebrow { margin-top: 54px; color: #b59563; letter-spacing: 5px; font-size: 13px; }

  .card { border: 1px solid #685337; background: #171c28; padding: 26px; border-radius: 12px; }
  .featured { width: 620px; height: 315px; }
  .secondary { width: 390px; height: 315px; border-color: #3e4653; }
  .number { color: #b79a67; font-size: 13px; letter-spacing: 3px; }

  .list { margin-top: 26px; color: #d3c1a4; line-height: 2.5; font-size: 15px; }

<main class="shell">
  <header class="top"><div class="brand">☾ 月夜议会</div><nav class="nav"><span>游戏大厅</span><span>角色图鉴</span><span>AI 来客</span><span>设置</span></nav><div class="profile">沙洲 · 玩家档案</div></header>
