<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>月蚀圣龛 · 小卡框精修对比</title>
  <link rel="icon" href="../../../web/assets/brand/wolf-emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="frame-kit.css">
  <link rel="stylesheet" href="compact-study.css">
</head>
<body>
  <main class="study">
    <header class="study-header">
      <a class="study-brand" href="index.html"><img src="../../../web/assets/brand/wolf-emblem.svg" alt=""><span>月蚀圣龛<small>卡牌视觉工坊</small></span></a>
      <span class="study-edition">COMPACT FRAME <span>／</span> DETAIL STUDY</span>
    </header>

    <section class="study-intro" aria-labelledby="study-title">
      <div><p class="study-eyebrow">小卡框 · 精修对比</p><h1 id="study-title">轻薄之间，见雕工</h1></div>
      <p>相同立绘、相同尺寸、相同光照。<br>只比较框体，不改变大卡。</p>
    </section>

    <div class="study-layout">
      <div class="study-left">
        <section class="study-panel scale-panel" aria-labelledby="actual-title">
          <div class="panel-heading"><span class="panel-number">01</span><div><h2 id="actual-title">实际使用尺寸</h2><p>未经放大的 52px 与 62px</p></div><span class="size-tag">1 : 1</span></div>
          <div class="size-comparisons">
            <section class="size-comparison" aria-label="手机身份牌52像素对比">
              <h3><strong>52<span>px</span></strong><span>手机身份牌</span></h3>
              <div class="card-pair actual-pair">
                <figure class="study-card old-card"><div data-study-card="seer" data-width="52" data-version="old"></div><figcaption>原版</figcaption></figure>
                <figure class="study-card new-card"><div data-study-card="seer" data-width="52"></div><figcaption>精修版</figcaption></figure>
              </div>
            </section>
            <section class="size-comparison" aria-label="桌面侧栏62像素对比">
              <h3><strong>62<span>px</span></strong><span>桌面侧栏</span></h3>
              <div class="card-pair actual-pair">
                <figure class="study-card old-card"><div data-study-card="seer" data-width="62" data-version="old"></div><figcaption>原版</figcaption></figure>
                <figure class="study-card new-card"><div data-study-card="seer" data-width="62"></div><figcaption>精修版</figcaption></figure>
              </div>
            </section>
          </div>
        </section>

        <section class="study-panel theme-panel" aria-labelledby="theme-title">
          <div class="panel-heading"><span class="panel-number">02</span><div><h2 id="theme-title">四种印记，同一副薄框</h2><p>精修版 · 均为真实 62px 宽</p></div></div>
          <div class="theme-cards">
            <figure class="study-card theme-wolf"><div data-study-card="wolf" data-width="62"></div><figcaption>血月<small>狼人</small></figcaption></figure>
            <figure class="study-card theme-oracle"><div data-study-card="seer" data-width="62"></div><figcaption>月谕<small>神职</small></figcaption></figure>
            <figure class="study-card theme-village"><div data-study-card="villager" data-width="62"></div><figcaption>炉火<small>村民</small></figcaption></figure>
            <figure class="study-card theme-fate"><div data-study-card="admirer" data-width="62"></div><figcaption>命线<small>暗恋者</small></figcaption></figure>
          </div>
        </section>
      </div>

      <section class="study-panel detail-panel" aria-labelledby="detail-title">
        <div class="panel-heading"><span class="panel-number">03</span><div><h2 id="detail-title">细节放大</h2><p>小卡框放大至 192px，方便查看工艺</p></div></div>
        <div class="card-pair detail-pair">
          <figure class="study-card old-card"><div data-study-card="seer" data-width="192" data-version="old"></div><figcaption>原版<small>小卡框 · 放大展示</small></figcaption></figure>
          <figure class="study-card new-card"><div data-study-card="seer" data-width="192"></div><figcaption>精修版<small>小卡框 · 放大展示</small></figcaption></figure>
        </div>
        <p class="detail-note">此处为细节放大，不代表实际界面占屏大小。</p>
      </section>
    </div>

    <footer class="study-footer"><span>真实小卡保持 2:3 · 沿用现有角色立绘</span><a href="index.html">查看完整卡牌设计 <span aria-hidden="true">↗</span></a></footer>
  </main>
  <script src="frame-kit.js"></script>
  <script src="compact-study.js"></script>
</body>
</html>
